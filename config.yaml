# Сохраняю в отчёте запуска; случайных операций в текущем алгоритме нет.
seed: 42

retrieval:
  # Для заголовка и описания строю отдельные индексы слов и пар соседних слов.
  ngram_range: [1, 2]
  # Убираю признаки, встречающиеся только в одном объявлении соответствующего поля.
  min_df: 2

character_retrieval:
  # Символьный канал использует только заголовок, анализатор char_wb задан в коде.
  field: item_title_raw
  # Фрагменты длиной 3–5 символов могут совпасть даже при разных окончаниях слов.
  ngram_range: [3, 5]
  min_df: 2

submission:
  # Каждый из шести каналов отдаёт до 50 кандидатов перед объединением.
  candidates_per_channel: 50
  # После удаления повторов оставляю до 50 ID — лимит из условия задачи.
  final_k: 50
  # Число запросов в одном GPU-пакете; влияет на объём временных матриц.
  gpu_batch_size: 16
  # Интервал сообщений о прогрессе в запросах. Последний пакет печатается всегда.
  progress_every: 500
